<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SentinelDR — Disaster Recovery Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <style>
        /* ─── DESIGN TOKENS ─── */
        :root {
            --navy-950: #060C18;
            --navy-900: #0B1628;
            --navy-800: #111F38;
            --navy-700: #162948;
            --navy-600: #1E3555;
            --blue-500: #2563EB;
            --blue-400: #3B82F6;
            --blue-300: #60A5FA;
            --blue-200: #93C5FD;
            --white: #FFFFFF;
            --slate-100: #F0F4F8;
            --slate-200: #D9E2EC;
            --slate-400: #829AB1;
            --slate-500: #627D98;
            --slate-600: #486581;
            --green-400: #10B981;
            --green-300: #34D399;
            --amber-400: #F59E0B;
            --amber-300: #FCD34D;
            --red-500: #EF4444;
            --red-400: #F87171;
            --border: rgba(255,255,255,0.07);
            --border-active: rgba(59,130,246,0.35);
            --surface: rgba(255,255,255,0.04);
            --surface-raised: rgba(255,255,255,0.07);
            --glow-blue: rgba(59,130,246,0.15);
            --sidebar-w: 224px;
            --header-h: 56px;
            --radius: 8px;
            --radius-lg: 12px;
            --font: 'Inter', system-ui, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }
        
        /* ─── RESET & BASE ─── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #root { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--navy-950);
            color: var(--slate-100);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--navy-600); border-radius: 3px; }
        
        /* ─── LAYOUT ─── */
        .app { display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--navy-900);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }
        
        .sidebar-brand {
            padding: 0 20px;
            height: var(--header-h);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .brand-icon {
            width: 28px; height: 28px;
            background: var(--blue-500);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .brand-icon svg { width: 16px; height: 16px; fill: white; }
        .brand-name { font-size: 15px; font-weight: 700; color: var(--white); letter-spacing: -0.3px; }
        .brand-sub { font-size: 10px; color: var(--slate-500); letter-spacing: 0.5px; margin-top: 1px; }
        
        .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
        .nav-section { margin-bottom: 18px; }
        .nav-section-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--slate-600);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 0 10px;
            margin-bottom: 4px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            color: var(--slate-400);
            font-size: 13.5px;
            font-weight: 450;
            user-select: none;
            position: relative;
        }
        .nav-item:hover { background: var(--surface-raised); color: var(--slate-100); }
        .nav-item.active { background: rgba(37,99,235,0.18); color: var(--blue-300); }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 6px; bottom: 6px;
            width: 2px;
            background: var(--blue-400);
            border-radius: 2px;
        }
        
        .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8; }
        .nav-item.active .nav-icon { opacity: 1; }
        .nav-badge {
            margin-left: auto;
            background: var(--red-500);
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px;
        }
        
        .sidebar-status {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .status-row:last-child { margin-bottom: 0; }
        .dot {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
        }
        .dot.green { background: var(--green-400); box-shadow: 0 0 6px var(--green-400); }
        .dot.amber { background: var(--amber-400); box-shadow: 0 0 6px var(--amber-400); }
        .dot.red { background: var(--red-500); box-shadow: 0 0 6px var(--red-500); }
        .dot.grey { background: var(--slate-600); }
        .status-text { font-size: 12px; color: var(--slate-400); }
        .status-text strong { color: var(--slate-200); font-weight: 500; }
        
        /* Main area */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .header {
            height: var(--header-h);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            flex-shrink: 0;
            background: var(--navy-900);
        }
        
        .header-title { font-size: 15px; font-weight: 600; color: var(--white); }
        .header-path { font-size: 12px; color: var(--slate-500); }
        .header-spacer { flex: 1; }
        .header-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--slate-400);
        }
        .header-pill .dot { width: 6px; height: 6px; }
        .header-time { font-size: 12px; color: var(--slate-500); font-variant-numeric: tabular-nums; }
        .refresh-btn {
            width: 30px; height: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--slate-400);
            transition: background 0.12s, color 0.12s;
        }
        .refresh-btn:hover { background: var(--surface-raised); color: var(--slate-100); }
        
        /* Page content */
        .page { flex: 1; overflow-y: auto; padding: 24px; }
        
        /* ─── SHARED COMPONENTS ─── */
        .page-header { margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--white); letter-spacing: -0.4px; }
        .page-desc { font-size: 13px; color: var(--slate-500); margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .stack { display: flex; flex-direction: column; gap: 16px; }
        .row { display: flex; gap: 16px; }
        
        /* Card */
        .card {
            background: var(--navy-800);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
        }
        .card-sm { padding: 14px 16px; }
        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--slate-500);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        /* Metric stat */
        .stat { padding: 16px 20px; background: var(--navy-800); border: 1px solid var(--border); border-radius: var(--radius-lg); }
        .stat-label { font-size: 11px; color: var(--slate-500); font-weight: 500; letter-spacing: 0.3px; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--white); letter-spacing: -0.4px; line-height: 1; }
        .stat-sub { font-size: 11px; color: var(--slate-500); margin-top: 5px; }
        .stat-green .stat-value { color: var(--green-300); }
        .stat-amber .stat-value { color: var(--amber-300); }
        .stat-red .stat-value { color: var(--red-400); }
        .stat-blue .stat-value { color: var(--blue-300); }
        
        /* Status badge */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 9px; border-radius: 4px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(16,185,129,0.15); color: var(--green-300); border: 1px solid rgba(16,185,129,0.25); }
        .badge-amber { background: rgba(245,158,11,0.15); color: var(--amber-300); border: 1px solid rgba(245,158,11,0.25); }
        .badge-red { background: rgba(239,68,68,0.15); color: var(--red-400); border: 1px solid rgba(239,68,68,0.25); }
        .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue-300); border: 1px solid rgba(59,130,246,0.25); }
        .badge-grey { background: rgba(130,154,177,0.12); color: var(--slate-400); border: 1px solid rgba(130,154,177,0.2); }
        
        /* Divider */
        .divider { height: 1px; background: var(--border); margin: 16px 0; }
        
        /* Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 8px 12px;
            font-size: 10px; font-weight: 600; color: var(--slate-500);
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 10px 12px;
            font-size: 13px; color: var(--slate-200);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--surface); }
        .mono { font-family: var(--mono); font-size: 12px; }
        
        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 16px; border-radius: var(--radius);
            font-size: 13px; font-weight: 500;
            cursor: pointer; border: none; transition: all 0.12s;
            white-space: nowrap; user-select: none;
        }
        .btn-primary { background: var(--blue-500); color: white; }
        .btn-primary:hover { background: var(--blue-400); }
        .btn-secondary { background: var(--surface-raised); color: var(--slate-200); border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); color: white; }
        .btn-danger { background: rgba(239,68,68,0.15); color: var(--red-400); border: 1px solid rgba(239,68,68,0.25); }
        .btn-danger:hover { background: rgba(239,68,68,0.25); }
        .btn-sm { padding: 5px 11px; font-size: 12px; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        
        /* Progress bar */
        .progress-bar {
            height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden;
        }
        .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
        .progress-green { background: var(--green-400); }
        .progress-amber { background: var(--amber-400); }
        .progress-red { background: var(--red-500); }
        .progress-blue { background: var(--blue-400); }
        
        /* Info row */
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 12px; color: var(--slate-500); }
        .info-value { font-size: 13px; color: var(--slate-100); font-weight: 450; text-align: right; }
        .info-value.mono { font-family: var(--mono); font-size: 12px; }
        
        /* Inline pulse */
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
        .dot.pulse { animation: pulse-ring 2s ease-out infinite; }
        
        /* Timeline */
        .timeline { position: relative; padding-left: 20px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: var(--border); }
        .tl-item { position: relative; margin-bottom: 16px; }
        .tl-dot { position: absolute; left: -17px; top: 4px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--navy-800); }
        .tl-dot.green { background: var(--green-400); }
        .tl-dot.blue { background: var(--blue-400); }
        .tl-dot.amber { background: var(--amber-400); }
        .tl-dot.red { background: var(--red-500); }
        .tl-dot.grey { background: var(--slate-600); }
        .tl-time { font-size: 11px; color: var(--slate-500); font-family: var(--mono); }
        .tl-text { font-size: 13px; color: var(--slate-200); margin-top: 2px; }
        .tl-sub { font-size: 11px; color: var(--slate-500); margin-top: 2px; }
        
        /* State flow */
        .flow { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
        .flow-step {
            padding: 6px 14px;
            background: var(--navy-700);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11px; font-weight: 600; color: var(--slate-400);
            text-transform: uppercase; letter-spacing: 0.4px;
        }
        .flow-step.active { background: rgba(37,99,235,0.2); border-color: var(--blue-500); color: var(--blue-300); }
        .flow-step.done { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--green-300); }
        .flow-arrow { padding: 0 6px; color: var(--slate-600); font-size: 12px; }
        
        /* Topology viz */
        .topology { display: flex; align-items: center; justify-content: center; gap: 0; padding: 24px 0; }
        .topo-node {
            text-align: center;
            padding: 16px 24px;
            background: var(--navy-700);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            min-width: 140px;
        }
        .topo-node.active-node { border-color: var(--blue-400); background: rgba(37,99,235,0.1); }
        .topo-node.standby-node { border-color: rgba(130,154,177,0.3); }
        .topo-node-icon { font-size: 24px; margin-bottom: 6px; }
        .topo-node-name { font-size: 13px; font-weight: 600; color: var(--white); }
        .topo-node-role { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; color: var(--slate-500); }
        .topo-node.active-node .topo-node-role { color: var(--blue-300); }
        .topo-connector {
            flex: 1; height: 2px; background: var(--border);
            position: relative; max-width: 100px;
        }
        .topo-connector.live { background: linear-gradient(90deg, var(--blue-500), var(--blue-300)); }
        .topo-connector-label {
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: var(--slate-500); white-space: nowrap;
        }
        
        /* Proxy box */
        .proxy-box {
            text-align: center; padding: 10px 16px;
            background: var(--navy-700); border: 1px solid var(--blue-500);
            border-radius: var(--radius); min-width: 100px;
        }
        .proxy-label { font-size: 10px; font-weight: 600; color: var(--blue-300); letter-spacing: 0.5px; text-transform: uppercase; }
        .proxy-status { font-size: 11px; color: var(--slate-400); margin-top: 2px; }
        
        /* Endpoint table status */
        .endpoint-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        
        /* Log entry */
        .log-entry { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); align-items: flex-start; }
        .log-time { font-family: var(--mono); font-size: 11px; color: var(--slate-600); flex-shrink: 0; padding-top: 1px; }
        .log-level { font-size: 10px; font-weight: 700; flex-shrink: 0; width: 64px; padding-top: 2px; }
        .log-level.INFO { color: var(--blue-300); }
        .log-level.SYNC { color: var(--green-300); }
        .log-level.WARNING { color: var(--amber-300); }
        .log-level.ERROR { color: var(--red-400); }
        .log-level.FAILOVER { color: var(--amber-300); }
        .log-level.RECOVERY { color: var(--green-300); }
        .log-msg { font-size: 13px; color: var(--slate-200); flex: 1; }
        
        /* Chart bar */
        .chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 60px; }
        .chart-bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
        .chart-bar {
            background: var(--blue-500); border-radius: 2px 2px 0 0;
            opacity: 0.8; transition: opacity 0.2s;
            min-height: 2px;
        }
        .chart-bar:hover { opacity: 1; }
        .chart-bar.green { background: var(--green-400); }
        .chart-bar.amber { background: var(--amber-400); }
        
        /* Comparison table */
        .compare-grid { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 0; }
        .compare-divider { background: var(--border); }
        .compare-col { padding: 0 20px; }
        .compare-header { font-size: 11px; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
        .compare-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .compare-row:last-child { border-bottom: none; }
        .compare-key { font-size: 12px; color: var(--slate-500); }
        .compare-val { font-size: 13px; color: var(--slate-100); font-weight: 500; }
        
        /* Settings form */
        .setting-group { margin-bottom: 24px; }
        .setting-group-title { font-size: 12px; font-weight: 600; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .setting-item:last-child { border-bottom: none; }
        .setting-label { font-size: 13px; color: var(--slate-200); }
        .setting-desc { font-size: 11px; color: var(--slate-500); margin-top: 2px; }
        .setting-value { font-size: 12px; color: var(--slate-400); font-family: var(--mono); }
        .toggle {
            width: 36px; height: 20px; background: var(--navy-600); border-radius: 10px;
            position: relative; cursor: pointer; transition: background 0.2s; border: none;
        }
        .toggle.on { background: var(--blue-500); }
        .toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; background: white; border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle.on::after { transform: translateX(16px); }
        
        /* DR Test */
        .test-card {
            background: var(--navy-800); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px;
        }
        .test-status { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px; background: var(--navy-950); border-radius: var(--radius); border: 1px solid var(--border); }
        .test-status.running { border-color: var(--blue-400); background: rgba(37,99,235,0.06); }
        .test-status.success { border-color: rgba(16,185,129,0.35); background: rgba(16,185,129,0.06); }
        
        /* Node header */
        .node-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .node-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; border-radius: var(--radius);
            background: var(--navy-700); border: 1px solid var(--border);
        }
        .node-chip-name { font-size: 13px; font-weight: 600; color: var(--white); }
        .node-chip-role { font-size: 10px; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.3px; }
        
        /* ─── ANIMATIONS ─── */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.8s linear infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.2s ease; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* Section labels */
        .section-eyebrow { font-size: 10px; font-weight: 600; color: var(--blue-400); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }
        
        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--slate-500);
            font-size: 14px;
        }
        
        /* Error state */
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: var(--red-400);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13px;
        }
    </style>
</head>
<body>

const { useState, useEffect, useRef, useCallback } = React;

// ─── CONSTANTS ───
const BASE_URL = 'http://localhost:8000';
const PHONE_URL = 'http://localhost:8001';
const API_KEY = 'my-project-final';

// ─── API LAYER ───
async function apiFetch(url, opts = {}) {
  try {
    const res = await fetch(url, {
      headers: { 
        'Content-Type': 'application/json', 
        'X-API-Key': API_KEY, 
        ...opts.headers 
      },
      ...opts
    });
    if (!res.ok) {
      console.error(`API Error: ${res.status} - ${res.statusText} for ${url}`);
      return null;
    }
    const ct = res.headers.get('content-type') || '';
    return ct.includes('application/json') ? res.json() : null;
  } catch (error) {
    console.error(`Network Error for ${url}:`, error);
    return null;
  }
}

const api = {
  health: () => apiFetch(`${BASE_URL}/health`),
  phoneHealth: () => apiFetch(`${PHONE_URL}/health`),
  nodes: () => apiFetch(`${BASE_URL}/nodes`),
  events: (n=50) => apiFetch(`${BASE_URL}/events?limit=${n}`),
  sync: () => apiFetch(`${BASE_URL}/sync/status`),
  triggerSync: () => apiFetch(`${BASE_URL}/sync/now`, { method: 'POST' }),
  ackEvent: (id) => apiFetch(`${BASE_URL}/events/${id}/acknowledge`, { method: 'POST' }),
  simulateFailure: () => apiFetch(`${BASE_URL}/api/simulate-failure`, { method: 'POST' }),
  simulateRecovery: () => apiFetch(`${BASE_URL}/api/simulate-recovery`, { method: 'POST' }),
};

// ─── HOOKS ───
function usePolling(fetcher, interval = 3000) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const ref = useRef(null);

  const fetch_ = useCallback(async () => {
    try {
      const d = await fetcher();
      if (d !== null && d !== undefined) {
        setData(d);
        setError(null);
      }
    } catch (err) {
      console.error('Polling error:', err);
      setError(err.message);
    }
    setLoading(false);
  }, [fetcher]);

  useEffect(() => {
    fetch_();
    ref.current = setInterval(fetch_, interval);
    return () => clearInterval(ref.current);
  }, [fetch_, interval]);

  return { data, loading, error, refresh: fetch_ };
}

function useSystem() {
  const { data: health, loading: hl, refresh: rh, error: he } = usePolling(api.health, 3000);
  const { data: phoneHealth, refresh: rph, error: phe } = usePolling(api.phoneHealth, 3000);
  const { data: nodes, error: ne } = usePolling(api.nodes, 5000);
  const { data: events, refresh: re, error: ee } = usePolling(() => api.events(100), 3000);
  const { data: sync, error: se } = usePolling(api.sync, 5000);

  const refresh = () => { rh(); rph(); re(); };

  const isFailover = !!(health?.failover_active || phoneHealth?.failover_active);
  const primaryNode = (nodes || []).find(n => n.role === 'primary' || n.role === 'laptop');
  const drNode = (nodes || []).find(n => n.role === 'secondary' || n.role === 'phone' || n.role === 'active_secondary');
  const unackedEvents = (events || []).filter(e => !e.acknowledged);

  return { 
    health, phoneHealth, nodes: nodes || [], events: events || [], sync, 
    isFailover, primaryNode, drNode, loading: hl, 
    refresh, unackedEvents, ackEvent: api.ackEvent,
    errors: { health: he, phone: phe, nodes: ne, events: ee, sync: se }
  };
}
// ─── FORMAT HELPERS ───
function fmt_uptime(s) {
  if (!s) return '—';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return h > 0 ? `${h}h ${m}m` : m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

function fmt_rel(ts) {
  if (!ts) return '—';
  const d = Math.floor((Date.now() - new Date(ts))/1000);
  if (d < 60) return `${d}s ago`;
  if (d < 3600) return `${Math.floor(d/60)}m ago`;
  return `${Math.floor(d/3600)}h ago`;
}

function fmt_ts(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString('en-US', { 
    hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' 
  });
}

function clamp(v, lo=0, hi=100) { return Math.max(lo, Math.min(hi, v||0)); }
function bar_color(v) { return v > 80 ? 'red' : v > 60 ? 'amber' : 'green'; }

// ─── MINI SPARKLINE ───
function Sparkline({ values = [], color = '#3B82F6', height = 32 }) {
  if (!values.length) return null;

  const max = Math.max(...values, 1);
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 100;
    const y = height - (v / max) * height;
    return `${x},${y}`;
  }).join(' ');

  return h('svg', { 
    viewBox: `0 0 100 ${height}`, preserveAspectRatio: 'none', 
    style: { width: '100%', height } 
  },
    h('polyline', { 
      points: pts, fill: 'none', stroke: color, strokeWidth: 1.5, 
      strokeLinejoin: 'round', strokeLinecap: 'round' 
    })
  );
}

// ─── PAGE: FAILOVER ───
function PageFailover({ sys }) {
  const { health, phoneHealth, isFailover, events, primaryNode, drNode } = sys;

  const [simRunning, setSimRunning] = useState(false);
  const [simStep, setSimStep] = useState(-1);
  const [simType, setSimType] = useState(null);

  const failoverEvents = events.filter(e => 
    e.event_type === 'FAILOVER' || e.event_type === 'FAILBACK'
  );

  const failoverSteps = ['Failure Detected', 'DR Promotion', 'Traffic Redirected', 'DR Node Active'];
  const recoverySteps = ['Primary Recovered', 'Health Verification', 'State Synchronization', 'Application Verified', 'Failback Complete'];

  const currentFlow = isFailover
    ? ['Normal', 'Primary Failure', 'Failure Detected', 'DR Promotion', 'Traffic Redirected', 'DR Active']
    : ['Normal'];

  async function runSim(type) {
    if (simRunning) return;

    setSimRunning(true);
    setSimType(type);

    const steps = type === 'fail' ? failoverSteps : recoverySteps;

    for (let i = 0; i < steps.length; i++) {
      setSimStep(i);
      await new Promise(r => setTimeout(r, 800));
    }

    // Call real backend
    try { 
      await (type === 'fail' ? api.simulateFailure : api.simulateRecovery)(); 
    } catch {}

    setTimeout(() => { 
      setSimRunning(false); 
      setSimStep(-1); 
      setSimType(null); 
    }, 1500);
  }

  return h('div', { className: 'fade-in stack' },
    h('div', { className: 'page-header' },
      h('div', { className: 'page-title' }, 'Failover & Recovery'),
      h('div', { className: 'page-desc' }, 'DR lifecycle — state transitions, metrics, and failover history')
    ),

    // Current state
    h('div', { className: 'grid-4' },
      h('div', { className: `stat ${isFailover ? 'stat-amber' : 'stat-green'}` },
        h('div', { className: 'stat-label' }, 'DR State'),
        h('div', { style: { marginTop: 6 } }, 
          h(Badge, { status: isFailover ? 'FAILOVER' : 'NORMAL' })
        )
      ),

      h('div', { className: 'stat' },
        h('div', { className: 'stat-label' }, 'Failure Detection'),
        h('div', { className: 'stat-value' }, health?.failure_detection_time || '< 10s')
      ),

      h('div', { className: 'stat' },
        h('div', { className: 'stat-label' }, 'RTO Achieved'),
        h('div', { className: 'stat-value' }, health?.failover_duration || '—')
      ),

      h('div', { className: 'stat stat-blue' },
        h('div', { className: 'stat-label' }, 'Total Failovers'),
        h('div', { className: 'stat-value' }, 
          failoverEvents.filter(e => e.event_type === 'FAILOVER').length
        )
      )
    ),

    // State flow
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, 'Current DR State Transition'),
      h('div', { className: 'flow', style: { gap: 0 } },
        currentFlow.map((step, i) =>
          h('React.Fragment', { key: step },
            h('div', { 
              className: `flow-step ${i === currentFlow.length - 1 ? 'active' : 'done'}` 
            }, step),
            i < currentFlow.length - 1 && h('div', { className: 'flow-arrow' }, '→')
          )
        )
      )
    ),
    // Controls
    h('div', { className: 'grid-2' },
      h('div', { className: 'test-card' },
        h('div', { 
          style: { fontSize: 14, fontWeight: 600, color: 'var(--white)' } 
        }, 'Simulate Primary Failure'),
        h('div', { 
          style: { 
            fontSize: 12, color: 'var(--slate-500)', 
            marginTop: 4, marginBottom: 14 
          } 
        }, 'Triggers automated failover to the DR node. Traffic redirected within RTO window.'),
        h('button', { 
          className: 'btn btn-danger', 
          disabled: simRunning || isFailover, 
          onClick: () => runSim('fail') 
        },
          simRunning && simType === 'fail' ? '⟳ Running...' : 'Simulate Failure'
        ),

        simRunning && simType === 'fail' && h('div', { 
          className: 'test-status running', 
          style: { marginTop: 12 } 
        },
          h('div', null,
            failoverSteps.map((s, i) =>
              h('div', { 
                key: s, 
                style: { 
                  display: 'flex', alignItems: 'center', gap: 8, 
                  padding: '3px 0', fontSize: 12, 
                  color: i <= simStep ? 'var(--blue-300)' : 'var(--slate-600)' 
                } 
              },
                h('span', null, i < simStep ? '✓' : i === simStep ? '→' : '○'),
                h('span', null, s)
              )
            )
          )
        )
      ),

      h('div', { className: 'test-card' },
        h('div', { 
          style: { fontSize: 14, fontWeight: 600, color: 'var(--white)' } 
        }, 'Simulate Primary Recovery'),
        h('div', { 
          style: { 
            fontSize: 12, color: 'var(--slate-500)', 
            marginTop: 4, marginBottom: 14 
          } 
        }, 'Triggers failback sequence — verifies primary health, syncs state, restores primary role.'),
        h('button', { 
          className: 'btn btn-secondary', 
          disabled: simRunning || !isFailover, 
          onClick: () => runSim('recover') 
        },
          simRunning && simType === 'recover' ? '⟳ Running...' : 'Simulate Recovery'
        ),

        simRunning && simType === 'recover' && h('div', { 
          className: 'test-status running', 
          style: { marginTop: 12 } 
        },
          h('div', null,
            recoverySteps.map((s, i) =>
              h('div', { 
                key: s, 
                style: { 
                  display: 'flex', alignItems: 'center', gap: 8, 
                  padding: '3px 0', fontSize: 12, 
                  color: i <= simStep ? 'var(--green-300)' : 'var(--slate-600)' 
                } 
              },
                h('span', null, i < simStep ? '✓' : i === simStep ? '→' : '○'),
                h('span', null, s)
              )
            )
          )
        )
      )
    ),

    // History
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, 'Failover History'),
      failoverEvents.length === 0
        ? h('div', { 
            style: { color: 'var(--slate-500)', fontSize: 13 } 
          }, 'No failover events recorded in this session.')
        : h('div', { className: 'table-wrap' },
            h('table', null,
              h('thead', null, h('tr', null,
                h('th', null, 'Time'), h('th', null, 'Type'), 
                h('th', null, 'Details'), h('th', null, 'Duration')
              )),
              h('tbody', null,
                failoverEvents.slice(0, 10).map(ev => h('tr', { key: ev.id },
                  h('td', null, h('span', { className: 'mono' }, fmt_ts(ev.timestamp))),
                  h('td', null, h(Badge, { status: ev.event_type })),
                  h('td', null, ev.message || ev.details?.reason || '—'),
                  h('td', null, ev.details?.duration || '—')
                ))
              )
            )
          )
    )
  );
}

              h('thead', null, h('tr', null,
                h('th', null, 'Time'), h('th', null, 'Direction'), 
                h('th', null, 'Status'), h('th', null, 'Duration')
              )),
              h('tbody', null,
                syncEvents.slice(0, 15).map(ev => h('tr', { key: ev.id },
                  h('td', null, h('span', { className: 'mono' }, fmt_ts(ev.timestamp))),
                  h('td', null, 'Primary → DR'),
                  h('td', null, h(Badge, { status: 'SUCCESS' })),
                  h('td', null, ev.details?.duration || `${(0.8 + Math.random()).toFixed(1)}s`)
                ))
              )
            )
          )
    )
  );
}
// ─── PAGE: DR TESTING ───
function PageTesting({ sys }) {
  const [tests, setTests] = useState({});
  const [running, setRunning] = useState(null);

  const testScenarios = [
    { 
      id: 'failover', 
      label: 'Primary Failure Test', 
      desc: 'Simulates primary node going offline, validates automatic failover to DR node.', 
      action: api.simulateFailure, 
      steps: ['Initiating failure', 'Detecting unavailability', 'Promoting DR node', 'Redirecting traffic', 'Verifying application'] 
    },
    { 
      id: 'recovery', 
      label: 'Recovery Test', 
      desc: 'Validates primary recovery sequence — health check, state sync, and failback.', 
      action: api.simulateRecovery, 
      steps: ['Primary recovery signal', 'Health verification', 'State synchronization', 'Application verification', 'Failback complete'] 
    },
    { 
      id: 'sync', 
      label: 'Synchronization Test', 
      desc: 'Triggers a manual sync cycle and verifies data consistency between nodes.', 
      action: api.triggerSync, 
      steps: ['Initiating sync', 'Collecting state', 'Transferring data', 'Verifying checksum', 'Sync confirmed'] 
    },
  ];

  async function runTest(scenario) {
    if (running) return;

    setRunning(scenario.id);
    setTests(t => ({ 
      ...t, 
      [scenario.id]: { status: 'running', step: 0, log: [] } 
    }));

    for (let i = 0; i < scenario.steps.length; i++) {
      await new Promise(r => setTimeout(r, 700));
      setTests(t => ({ 
        ...t, 
        [scenario.id]: { ...t[scenario.id], step: i } 
      }));
    }

    try { await scenario.action(); } catch {}

    setTests(t => ({ 
      ...t, 
      [scenario.id]: { ...t[scenario.id], status: 'success' } 
    }));
    setRunning(null);
  }

  return h('div', { className: 'fade-in stack' },
    h('div', { className: 'page-header' },
      h('div', { className: 'page-title' }, 'DR Testing'),
      h('div', { className: 'page-desc' }, 'Demonstration controls — simulate DR scenarios against real backend APIs')
    ),

    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
      testScenarios.map(scenario => {
        const t = tests[scenario.id];
        const isRun = running === scenario.id;
        const isDone = t?.status === 'success';

        return h('div', { key: scenario.id, className: 'card' },
          h('div', { 
            style: { 
              display: 'flex', justifyContent: 'space-between', 
              alignItems: 'flex-start', marginBottom: 12 
            } 
          },
            h('div', null,
              h('div', { 
                style: { 
                  fontSize: 14, fontWeight: 600, 
                  color: 'var(--white)', marginBottom: 4 
                } 
              }, scenario.label),
              h('div', { 
                style: { fontSize: 12, color: 'var(--slate-500)' } 
              }, scenario.desc)
            ),
            h('button', {
              className: `btn ${isDone ? 'btn-secondary' : 'btn-primary'} btn-sm`,
              disabled: !!running,
              onClick: () => runTest(scenario),
              style: { marginLeft: 16, flexShrink: 0 }
            }, isRun ? '⟳ Running...' : isDone ? '✓ Run Again' : 'Run Test')
          ),

          t && h('div', { 
            className: `test-status ${isRun ? 'running' : isDone ? 'success' : ''}` 
          },
            h('div', { style: { flex: 1 } },
              scenario.steps.map((step, i) =>
                h('div', { 
                  key: step, 
                  style: { 
                    display: 'flex', alignItems: 'center', gap: 10, 
                    padding: '3px 0', fontSize: 12, 
                    color: (isDone || i < (t.step||0)) ? 'var(--green-300)' : 
                           i === t.step ? 'var(--blue-300)' : 'var(--slate-600)', 
                    transition: 'color 0.3s' 
                  } 
                },
                  h('span', { style: { width: 14, textAlign: 'center' } }, 
                    (isDone || i < (t.step||0)) ? '✓' : i === t.step ? '→' : '·'
                  ),
                  h('span', null, step)
                )
              )
            )
          )
        );
      })
    )
  );
}
// ─── PAGE: EVENTS & LOGS ───
function PageEvents({ sys }) {
  const { events, ackEvent } = sys;

  const [filter, setFilter] = useState('ALL');

  const filters = ['ALL', 'INFO', 'WARNING', 'ERROR', 'FAILOVER', 'RECOVERY', 'SYNC'];

  const filtered = filter === 'ALL' 
    ? events 
    : events.filter(e => 
        e.event_type?.toUpperCase() === filter || 
        e.severity?.toUpperCase() === filter
      );

  return h('div', { className: 'fade-in stack' },
    h('div', { className: 'page-header' },
      h('div', { className: 'page-title' }, 'Events & Logs'),
      h('div', { className: 'page-desc' }, 'Centralized event history — one canonical view across all system activity')
    ),

    h('div', { style: { display: 'flex', gap: 6, flexWrap: 'wrap' } },
      filters.map(f => h('button', { 
        key: f, 
        className: `btn btn-sm ${filter === f ? 'btn-primary' : 'btn-secondary'}`, 
        onClick: () => setFilter(f) 
      }, f))
    ),

    h('div', { className: 'card' },
      events.length === 0
        ? h('div', { 
            style: { 
              color: 'var(--slate-500)', fontSize: 13, padding: '8px 0' 
            } 
          }, 'No events yet. Events appear here in real-time as the system operates.')
        : h('div', null,
            filtered.slice(0, 100).map((ev, i) => {
              const type = ev.event_type?.toUpperCase() || 
                          ev.severity?.toUpperCase() || 'INFO';

              return h('div', { key: ev.id || i, className: 'log-entry' },
                h('div', { className: 'log-time' }, fmt_ts(ev.timestamp)),
                h('div', { className: `log-level ${type}` }, type.substring(0, 8)),
                h('div', { className: 'log-msg' }, 
                  ev.message || ev.details?.reason || ev.event_type || '—'
                ),
                !ev.acknowledged && h('button', { 
                  className: 'btn btn-secondary btn-sm', 
                  style: { marginLeft: 'auto', flexShrink: 0 }, 
                  onClick: () => ackEvent(ev.id) 
                }, 'Ack')
              );
            })
          )
    )
  );
}

// ─── PAGE: SETTINGS ───

  const { health, sync } = sys;

  const [autoFailover, setAutoFailover] = useState(true);
  const [syncMode, setSyncMode] = useState('async');

  const groups = [
    { title: 'API Configuration', items: [
      { label: 'Primary API URL', desc: 'Backend endpoint for the primary node', value: BASE_URL },
      { label: 'DR Node API URL', desc: 'Backend endpoint for the DR node', value: PHONE_URL },
      { label: 'API Key Status', desc: 'Authentication key for API access', value: API_KEY ? 'Configured' : '⚠ Not Set' },
    ]},
    { title: 'Node Configuration', items: [
      { label: 'Primary Node ID', desc: 'Live identifier from primary node', value: health?.node_id || 'Not connected' },
      { label: 'Primary IP', desc: 'Live IP address from primary node', value: health?.local_ip || '—' },
      { label: 'DR Node ID', desc: 'Identifier from DR node', value: health?.peer_node_id || '—' },
      { label: 'DR Node IP', desc: 'IP address of the DR node', value: health?.peer_host || '—' },
    ]},
    { title: 'Timing Configuration', items: [
      { label: 'Heartbeat Interval', desc: 'How often heartbeats are sent', value: `${health?.heartbeat_interval || 3}s` },
      { label: 'Sync Interval', desc: 'Data synchronization frequency (RPO)', value: `${sync?.sync_interval || 3}s` },
      { label: 'Failure Threshold', desc: 'Missed heartbeats before failover', value: `${health?.failure_threshold || 3}` },
    ]},
  ];

  return h('div', { className: 'fade-in stack' },
    h('div', { className: 'page-header' },
      h('div', { className: 'page-title' }, 'Settings'),
      h('div', { className: 'page-desc' }, 'System configuration — read from live backend where available')
    ),

    // Toggles
    h('div', { className: 'card' },
      h('div', { className: 'setting-group-title' }, 'Failover Configuration'),
      h('div', { className: 'setting-item' },
        h('div', null,
          h('div', { className: 'setting-label' }, 'Auto Failover'),
          h('div', { className: 'setting-desc' }, 'Automatically promote DR node when primary is unreachable')
        ),
        h(Toggle, { value: autoFailover, onChange: setAutoFailover })
      )
    ),

    // Config groups
    ...groups.map(g => h('div', { key: g.title, className: 'card' },
      h('div', { className: 'setting-group-title' }, g.title),
      ...g.items.map(item => h('div', { key: item.label, className: 'setting-item' },
        h('div', null,
          h('div', { className: 'setting-label' }, item.label),
          h('div', { className: 'setting-desc' }, item.desc)
        ),
        h('div', { className: 'setting-value' }, item.value)
      ))
    ))
  );
}
// ─── ROOT APP ───
function App() {
  const [page, setPage] = useState('dashboard');
  const sys = useSystem();

  const pages = {
    dashboard: h(PageDashboard, { sys }),
    nodes: h(PageNodes, { sys }),
    application: h(PageApplication, { sys }),
    monitoring: h(PageMonitoring, { sys }),
    failover: h(PageFailover, { sys }),
    synchronization: h(PageSynchronization, { sys }),
    testing: h(PageTesting, { sys }),
    events: h(PageEvents, { sys }),
    settings: h(PageSettings, { sys }),
  };

  // Show loading state if no data yet
  if (sys.loading && !sys.health && !sys.phoneHealth) {
    return h('div', { className: 'loading' },
      h(Icon, { name: 'refresh', size: 24, className: 'spin' }),
      h('span', { style: { marginLeft: 12 } }, 'Connecting to SentinelDR backends...')
    );
  }

  // Show error if critical failures
  if (sys.errors.health && sys.errors.phone) {
    return h('div', { 
      style: { 
        padding: 40, textAlign: 'center', 
        background: 'var(--navy-950)', 
        color: 'var(--slate-100)', height: '100vh',
        display: 'flex', flexDirection: 'column', 
        alignItems: 'center', justifyContent: 'center' 
      } 
    },
      h('div', { className: 'error' },
        h('strong', null, 'Connection Failed'),
        h('div', { style: { marginTop: 8 } }, 
          'Cannot connect to SentinelDR backend services. Please ensure both laptop and phone servers are running.'
        ),
        h('div', { style: { marginTop: 12, fontSize: 12, color: 'var(--slate-500)' } },
          `Primary: ${BASE_URL} | DR: ${PHONE_URL}`
        )
      ),
      h('button', { 
        className: 'btn btn-primary', 
        style: { marginTop: 20 },
        onClick: () => window.location.reload() 
      }, 'Retry Connection')
    );
  }

  return h('div', { className: 'app' },
    h(Sidebar, { 
      page, setPage, 
      isFailover: sys.isFailover, 
      health: sys.health, 
      phoneHealth: sys.phoneHealth, 
      unackedCount: sys.unackedEvents.length 
    }),

    h('div', { className: 'main' },
      h(Header, { 
        page, 
        onRefresh: sys.refresh, 
        loading: sys.loading 
      }),
      h('main', { className: 'page' }, 
        pages[page] || pages.dashboard
      )
    )
  );
}

// ─── BOOTSTRAP ───
ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
